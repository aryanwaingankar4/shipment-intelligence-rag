name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests ui
      - name: Unit tests
        run: pytest
      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1
      - name: Retrieval quality gate (no LLM calls)
        env:
          CHROMA_PERSIST_PATH: /tmp/chroma_ci
        run: |
          shipment-rag ingest
          shipment-rag eval --min-score 0.9

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: false
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
