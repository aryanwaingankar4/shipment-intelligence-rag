[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipment-rag"
version = "0.3.2"
description = "Document-grounded RAG assistant for pharmaceutical cold-chain shipments, compliance and vendors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "chromadb==1.5.9",            # keep in lockstep with the chromadb/chroma image tag
    "sentence-transformers>=3,<7",
    "google-genai>=1.20,<3",
    "tenacity>=8.2,<10",
    "langchain-text-splitters>=0.3,<2",
    "rank-bm25>=0.2.2,<0.3",
    "httpx>=0.27",                # Ollama judge client; already installed via google-genai
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
shipment-rag = "shipment_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
